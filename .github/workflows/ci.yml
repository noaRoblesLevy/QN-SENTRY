# Continuous integration (#67): every pull request and every push to main runs the
# tests, pyflakes, a migration check, the dashboard lint and build, and the install script
# on a clean machine (#18).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request cancels the run that is still busy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and pyflakes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The tests need no database, but Settings must be complete to import the worker
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pyflakes
      - run: python -m pyflakes qnsentry tests
      - run: python -m pytest

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that only exists during this job: no secret needed
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      POSTGRES_HOST: 127.0.0.1
      # Required by Settings since #48; a throwaway value, nothing is verified against real DNS here
      DOMAIN_VERIFICATION_SECRET: ci-only-secret-for-domain-verification-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply all migrations to an empty database
        run: python -m qnsentry.db.migrate
      - name: Check that no model change lacks a migration
        run: alembic check
      # The API tests need a real PostgreSQL, which only this job has (tests/api/conftest.py)
      - name: API tests against PostgreSQL
        run: python -m pytest tests/api
        env:
          QNSENTRY_TEST_DATABASE: "1"

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          # The same version as dashboard/Dockerfile, so CI builds what the image builds
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  install:
    name: Install script on a clean machine
    # A fresh runner with Docker and nothing of QN-Sentry: what a new user starts from (#18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check the script with shellcheck
        run: shellcheck install.sh
      - name: Install and start QN-Sentry
        run: ./install.sh
        env:
          # The way the team passes its shared secret; a throwaway value here
          DOMAIN_VERIFICATION_SECRET: ci-only-secret-for-domain-verification-tests
      - name: The configuration has the given secret and a generated password
        run: |
          grep -qx 'DOMAIN_VERIFICATION_SECRET=ci-only-secret-for-domain-verification-tests' .env
          grep -Eqx 'POSTGRES_PASSWORD=[0-9a-f]{48}' .env
      - name: The dashboard answers and forwards the API
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"database":"ok"'
      - name: Running it again keeps the configuration
        run: |
          cp .env "$RUNNER_TEMP/env-before"
          ./install.sh
          cmp .env "$RUNNER_TEMP/env-before"
      - name: Without .env it refuses to touch the existing database
        run: |
          mv .env "$RUNNER_TEMP/env-saved"
          if ./install.sh; then echo "install.sh should have refused"; exit 1; fi
          test ! -f .env
          mv "$RUNNER_TEMP/env-saved" .env
      - name: Logs of a failed install
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove everything
        if: always()
        run: docker compose down -v
